name: MettaVoxAD 3.0 Bundle - Windows
on:
  push:
    branches: [main]
    paths: ['Bundle30/**', '.github/workflows/build_bundle_windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: build_bundle_${{ matrix.arch }}
          key: mv3-msvc-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: mv3-msvc-${{ matrix.arch }}-
      - name: Configure seven independent plugins
        shell: pwsh
        run: |
          cmake -S Bundle30 -B build_bundle_${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove obsolete cached product files
        shell: pwsh
        run: |
          Remove-Item "build_bundle_${{ matrix.arch }}/Legacy/Release/*.dll" -Force -ErrorAction SilentlyContinue
          Remove-Item "build_bundle_${{ matrix.arch }}/*_artefacts/Release/VST3/*.vst3" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "build_bundle_${{ matrix.arch }}/Stage" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Compile bundle
        shell: pwsh
        run: |
          cmake --build build_bundle_${{ matrix.arch }} --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build_bundle_${{ matrix.arch }} --config Release --target vst3_smoke --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit PE architecture and external dependencies
        shell: pwsh
        run: |
          $binaries=@(Get-ChildItem "build_bundle_${{ matrix.arch }}" -Recurse -File | Where-Object {($_.Extension -eq '.dll' -and $_.Name -like '*Metta*') -or $_.Extension -eq '.vst3'} | ForEach-Object {$_.FullName})
          python "Bundle30/Tests/CheckPeImports.py" ${{ matrix.arch }} @binaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: DSP, preset, state, bypass, loudness, true-peak and UI checks
        shell: pwsh
        run: |
          & "build_bundle_${{ matrix.arch }}/Release/bundle_checks.exe" "Bundle30/previews_${{ matrix.arch }}" 2>&1 | Tee-Object "Bundle30/validation_${{ matrix.arch }}.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Load every legacy DLL
        shell: pwsh
        run: |
          $names=@('Pure','Vocal','Impact','Morph','Orbit','Velvet','Apex')
          $dlls=@($names | ForEach-Object { "build_bundle_${{ matrix.arch }}/Legacy/Release/MettaVoxAD $_.dll" })
          & "build_bundle_${{ matrix.arch }}/Release/bundle_legacy_checks.exe" @dlls "Bundle30/previews_${{ matrix.arch }}/native" 2>&1 | Tee-Object "Bundle30/legacy_${{ matrix.arch }}.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Scan VST3 binaries and open their native editors
        shell: pwsh
        run: |
          $paths=@(Get-ChildItem "build_bundle_${{ matrix.arch }}/*_artefacts/Release/VST3/*.vst3" -Directory | ForEach-Object {$_.FullName})
          & "build_bundle_${{ matrix.arch }}/Release/vst3_smoke.exe" @paths 2>&1 | Tee-Object "Bundle30/vst3_${{ matrix.arch }}.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage seven VST3 bundles and build installer
        shell: pwsh
        run: |
          $stage="build_bundle_${{ matrix.arch }}/Stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $bundles=@(Get-ChildItem "build_bundle_${{ matrix.arch }}/*_artefacts/Release/VST3/*.vst3" -Directory)
          if ($bundles.Count -ne 7) { throw 'Expected seven compiled VST3 bundles' }
          foreach ($bundle in $bundles) { Copy-Item -LiteralPath $bundle.FullName -Destination $stage -Recurse -Force }
          $iscc=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { $iscc=Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe' }
          & $iscc "/DPluginArch=${{ matrix.arch }}" Bundle30/Installer/BundleSetup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, reinstall, uninstall and preserve 2.1.1
        shell: pwsh
        run: |
          ./Bundle30/Tests/InstallerChecks.ps1 -Architecture ${{ matrix.arch }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build_bundle_${{ matrix.arch }}
          key: mv3-msvc-${{ matrix.arch }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MettaVoxAD30-validation-${{ matrix.arch }}
          path: |
            Bundle30/*_${{ matrix.arch }}.txt
            Bundle30/previews_${{ matrix.arch }}/*
            ${{ runner.temp }}/bundle_${{ matrix.arch }}_install_*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: MettaVoxAD30-Bundle-Windows-${{ matrix.arch }}
          path: |
            Bundle30/Installer/Output/*.exe
            build_bundle_${{ matrix.arch }}/Legacy/Release/*.dll
            build_bundle_${{ matrix.arch }}/Stage/
          if-no-files-found: error
